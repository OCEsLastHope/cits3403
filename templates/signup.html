
<!DOCTYPE html>
<html>
<head>
    <title>Register</title>
    <link rel="stylesheet" href="../static/styles.css">
</head>

<body>
    <div class="page">
        <div class="register-container">
            <h1>Register</h1>
            <p class="register-subtitle">Create your account</p>

            <form method="POST">
                {% csrf_token %}

                <div class="name-row">
                    <input type="text" name="first_name" placeholder="First Name">
                    <input type="text" name="last_name" placeholder="Last Name">
                </div>

                <input type="email" name="email" placeholder="Email">
                <input type="text" name="degree" placeholder="Degree (eg. Bachelor of Science)">
                <input type="text" name="major" placeholder="Major (eg. Computer Science)">
                <input type="password" name="password" placeholder="Password">
                <input type="password" name="confirm_password" placeholder="Confirm Password">

                <div class="register-actions">
                    <button type="submit">REGISTER</button>
                    <p>Already registered? <a href="{% url 'login' %}">Login</a></p>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
