<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | StudyCollabz</title>

        <link rel="stylesheet" href="{{ url_for('static', filename='css/core/base.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/core/layout.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/components/buttons.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/pages/auth.css') }}">
</head>

<body class="forgot-password-page">

    <main class="forgot-wrapper">

        <section class="forgot-card">

            <div class="forgot-left">

                <h1>
                    Forgot <br>
                    <span>Your Password?</span>
                </h1>

                <p class="forgot-text">
                    No worries! Enter your email or username and we’ll send you a link to get back in.
                </p>

                {% if error %}
                    <p class="error-message">{{ error }}</p>
                {% endif %}

                {% if message %}
                    <p class="success-message">{{ message }}</p>
                {% endif %}

                <form method="POST" class="forgot-form" id="forgot-form">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                    <p id="forgot-error" class="form-error"></p>

                    <div class="forgot-input">
                        <span class="input-icon">👤</span>

                        <input 
                            type="text"
                            name="identifier"
                            id="identifier"
                            placeholder="Email or Username"
                            autocomplete="username"
                            required
                        >
                    </div>

                    <small class="input-message" id="identifier-message"></small>

                    <button type="submit" class="reset-btn" id="reset-btn">
                        Send Reset Link
                    </button>

                </form>

                <a href="{{ url_for('main.login') }}" class="back-link">
                    ← Back to Login
                </a>

            </div>

            <div class="forgot-right">
                <div class="glow-orb"></div>
                <div class="glow-ring"></div>
            </div>

        </section>

    </main>

    <script>
        const forgotForm = document.getElementById("forgot-form");
        const identifierInput = document.getElementById("identifier");
        const identifierMessage = document.getElementById("identifier-message");
        const forgotError = document.getElementById("forgot-error");
        const resetButton = document.getElementById("reset-btn");

        function validateIdentifier() {
            const value = identifierInput.value.trim();

            if (value.length === 0) {
                identifierMessage.textContent = "";
                return false;
            }

            if (value.includes("@")) {
                const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

                if (!emailPattern.test(value)) {
                    identifierMessage.textContent = "Please enter a valid email address.";
                    return false;
                }

                identifierMessage.textContent = "Email format looks good.";
                return true;
            }

            if (value.length < 5) {
                identifierMessage.textContent = "Username must be at least 5 characters.";
                return false;
            }

            identifierMessage.textContent = "Username format looks good.";
            return true;
        }

        identifierInput.addEventListener("input", validateIdentifier);

        forgotForm.addEventListener("submit", function(event) {
            forgotError.textContent = "";

            const identifierValid = validateIdentifier();

            if (!identifierValid) {
                event.preventDefault();
                forgotError.textContent = "Please enter a valid email or username.";
                return;
            }

            resetButton.textContent = "Sending...";
            resetButton.disabled = true;
        });
    </script>

</body>
</html>
