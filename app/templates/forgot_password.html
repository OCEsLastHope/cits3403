<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | StudySync</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>

<body class="forgot-password-page">

    <main class="forgot-wrapper">

        <section class="forgot-card">

            <!-- LEFT SIDE -->
            <div class="forgot-left">

                <h1>
                    Forgot <br>
                    <span>Your Password?</span>
                </h1>

                <p class="forgot-text">
                    No worries! Enter your email or username and we’ll send you a link to get back in.
                </p>

                {% if error %}
                    <p class="error-message">{{ error }}</p>
                {% endif %}

                {% if message %}
                    <p class="success-message">{{ message }}</p>
                {% endif %}

                <!-- FORM -->
                <form method="POST" class="forgot-form">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                    <div class="forgot-input">
                        <span class="input-icon">👤</span>

                        <input 
                            type="text"
                            name="identifier"
                            placeholder="Email or Username"
                            required
                        >
                    </div>

                    <button type="submit" class="reset-btn">
                        Send Reset Link
                    </button>

                </form>

                <!-- BACK LINK (FIXED) -->
                <a href="{{ url_for('login') }}" class="back-link">
                    ← Back to Login
                </a>

            </div>

            <!-- RIGHT SIDE -->
            <div class="forgot-right">
                <div class="glow-orb"></div>
                <div class="glow-ring"></div>
            </div>

        </section>

    </main>

</body>
</html>
