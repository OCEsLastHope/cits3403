<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | StudySync</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>

<body>

    <section class="reset-password-page">

        <div class="reset-card">

            <h1>Reset Your Password</h1>

            <p>
                Enter your new password below to secure your StudySync account.
            </p>

            <form method="POST" class="reset-form">

                <input
                    type="hidden"
                    name="csrf_token"
                    value="{{ csrf_token() }}"
                >

                <label for="password">
                    New Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter new password"
                    required
                >

                <small
                    class="input-message"
                    id="password-message"
                ></small>


                <label for="confirm_password">
                    Confirm Password
                </label>

                <input
                    type="password"
                    id="confirm_password"
                    name="confirm_password"
                    placeholder="Confirm new password"
                    required
                >

                <small
                    class="input-message"
                    id="confirm-password-message"
                ></small>

                <button type="submit">
                    Reset Password
                </button>

            </form>

            <a
                href="{{ url_for('login') }}"
                class="reset-back-link"
            >
                ← Back to Login
            </a>

        </div>

    </section>

    <script>

        const resetForm =
            document.querySelector(".reset-form");

        const passwordInput =
            document.getElementById("password");

        const confirmPasswordInput =
            document.getElementById("confirm_password");

        const passwordMessage =
            document.getElementById("password-message");

        const confirmPasswordMessage =
            document.getElementById("confirm-password-message");

        let passwordIsValid = false;
        let passwordsMatch = false;

        function setMessage(element, message, type) {

            element.textContent = message;

            element.classList.remove(
                "valid-message",
                "error-message"
            );

            if (type === "valid") {
                element.classList.add("valid-message");
            }

            if (type === "error") {
                element.classList.add("error-message");
            }
        }

        function checkPassword() {

            const password =
                passwordInput.value;

            passwordIsValid = false;

            if (!password) {

                setMessage(
                    passwordMessage,
                    "",
                    ""
                );

                return;
            }

            if (password.length < 6) {

                setMessage(
                    passwordMessage,
                    "Password must be at least 6 characters.",
                    "error"
                );

                return;
            }

            passwordIsValid = true;

            setMessage(
                passwordMessage,
                "Password format looks valid.",
                "valid"
            );
        }

        function checkConfirmPassword() {

            const password =
                passwordInput.value;

            const confirmPassword =
                confirmPasswordInput.value;

            passwordsMatch = false;

            if (!confirmPassword) {

                setMessage(
                    confirmPasswordMessage,
                    "",
                    ""
                );

                return;
            }

            if (password !== confirmPassword) {

                setMessage(
                    confirmPasswordMessage,
                    "Passwords do not match.",
                    "error"
                );

                return;
            }

            passwordsMatch = true;

            setMessage(
                confirmPasswordMessage,
                "Passwords match.",
                "valid"
            );
        }

        passwordInput.addEventListener(
            "input",
            function() {

                checkPassword();
                checkConfirmPassword();
            }
        );

        confirmPasswordInput.addEventListener(
            "input",
            function() {

                checkConfirmPassword();
            }
        );

        resetForm.addEventListener(
            "submit",
            function(event) {

                checkPassword();
                checkConfirmPassword();

                if (
                    !passwordIsValid ||
                    !passwordsMatch
                ) {
                    event.preventDefault();
                }
            }
        );

    </script>

</body>
</html>
